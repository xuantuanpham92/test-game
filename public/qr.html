<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myfuyao.top 二维码</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, sans-serif;
  }
  .card {
    background: white; border-radius: 24px; padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center;
  }
  h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
  p { font-size: 14px; color: #999; margin-bottom: 20px; }
  img { border-radius: 12px; width: 260px; height: 260px; }
  .url { margin-top: 16px; font-size: 16px; color: #6366f1; font-weight: 600; }
  .tip { margin-top: 12px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>
<div class="card">
  <h1>扶摇弱科人格画像</h1>
  <p>扫码开始测试</p>
  <img src="qrcode.png" alt="QR Code">
  <div class="url">myfuyao.top</div>
  <p class="tip">手机相机扫码即可进入</p>
</div>
